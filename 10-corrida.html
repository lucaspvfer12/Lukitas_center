<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida</title><style>body{background:#222;color:#fff;text-align:center;font:18px Arial}canvas{background:#555;max-width:95vw}</style><h1>🏎️ Corrida</h1><p>← → mover | Pontos: <b id=s>0</b></p><canvas id=c width="400" height="600"></canvas><script>let x=c.getContext('2d'),p=175,en=[],sc=0;onkeydown=e=>{if(e.key==='ArrowLeft')p-=25;if(e.key==='ArrowRight')p+=25};function f(){x.clearRect(0,0,400,600);p=Math.max(20,Math.min(340,p));if(Math.random()<.02)en.push({x:[45,145,245,325][Math.random()*4|0],y:-80});en.forEach(a=>a.y+=5);if(en.some(a=>a.x<p+40&&a.x+40>p&&a.y+70>500&&a.y<580))return alert('Batida! Pontos: '+sc);en=en.filter(a=>a.y<620);x.fillStyle='#222';x.fillRect(20,0,360,600);x.fillStyle='#fff';for(let y=0;y<600;y+=80)x.fillRect(195,y,10,40);x.fillStyle='#f44';x.fillRect(p,520,40,60);x.fillStyle='#4af';en.forEach(a=>x.fillRect(a.x,a.y,40,60));sc++;s.textContent=Math.floor(sc/10);requestAnimationFrame(f)}f()</script>
